<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#24273A">
<title>FastTask</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #24273A; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #loading {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    color: #A5ADCB; font: 14px system-ui, sans-serif; text-align: center; padding: 16px;
  }
  #loading pre { white-space: pre-wrap; color: #ED8796; font-size: 12px; max-width: 100%; }
  .spinner {
    width: 24px; height: 24px; border-radius: 50%;
    border: 3px solid #494D64; border-top-color: #8AADF4;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<canvas id="the_canvas_id"></canvas>
<div id="loading"><div class="spinner"></div><p>Loading FastTask…</p></div>
<script type="module">
  import init from './app.js';
  init().catch((e) => {
    document.getElementById('loading').innerHTML =
      '<p>FastTask couldn\'t load.</p><pre></pre>';
    document.querySelector('#loading pre').textContent = String(e);
  });
</script>
</body>
</html>
