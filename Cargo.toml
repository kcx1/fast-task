[package]
name = "fast-task"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
# Same bson polodb_core re-exports; used directly so `models` builds for wasm.
bson = "2.15"
egui = { version = "0.34.1" }
egui_extras = { version = "0.34.1", features = ["datepicker", "syntect"] }
jiff = "0.2.23"
serde = { version = "1.0.219", features = ["derive"] }

# Desktop app + LAN share server.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.8" }
dirs = "6.0.0"
eframe = "0.34.1"
futures-util = "0.3"
getrandom = "0.3"
local-ip-address = "0.6"
parking_lot = "0.12"
polodb_core = "5.1.4"
qrcode = { version = "0.14", default-features = false }
resvg = "0.44"
rust-embed = "8"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

# Browser client served by the LAN share (see scripts/build-web.sh).
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.34.1", default-features = false, features = ["default_fonts", "glow"] }
ehttp = "0.5"
jiff = { version = "0.2.23", features = ["js"] }
js-sys = "0.3"
log = "0.4"
serde_json = "1"
wasm-bindgen = "=0.2.117"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventSource", "EventTarget", "HtmlCanvasElement", "Location", "MessageEvent", "Storage", "Window"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1.50.0", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
